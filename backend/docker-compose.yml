services:
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    volumes:
      - ./backend:/app
      - ./uploads:/app/uploads
      - ./exports:/app/exports
    environment:
      - REDIS_URL=redis://redis:6379/0
      - MAIL_SERVER=smtp.mailtrap.io
      - MAIL_PORT=2525
    depends_on:
      - redis

  worker:
    build: ./backend
    command: celery -A tasks.celery worker --loglevel=info
    depends_on:
      - redis
      - backend

  beat:
    build: ./backend
    command: celery -A tasks.celery beat --loglevel=info
    depends_on:
      - redis

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"